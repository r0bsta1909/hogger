# Release-Pipeline (GDD 17.0 Punkt 3): Tag v* -> .love/.exe/.app als
# Release-Artefakte; LAN-Verteilung = Release-Link.
# Eine .love ist die Wahrheit (GDD Kap. 14): Zip-Wurzel enthaelt main.lua/
# conf.lua (Kopien aus game/) plus die Baeume game/, sim/, assets/ — LOEVEs
# Zip-Loader loest require("game.*")/require("sim.*") gegen die Archivwurzel.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ".love bauen (eine Wahrheit)"
        run: |
          mkdir -p build/love
          cp -r game sim assets build/love/
          cp game/main.lua game/conf.lua build/love/
          find build/love -name '.gitkeep' -delete
          (cd build/love && zip -9 -q -r ../hogger.love .)
          unzip -l build/hogger.love | grep -q " main.lua" || exit 1
          unzip -l build/hogger.love | grep -q "sim/model.lua" || exit 1

      - name: ".exe bauen (Windows, LOEVE 11.5 gepinnt)"
        run: |
          curl -sL -o love-win64.zip \
            https://github.com/love2d/love/releases/download/11.5/love-11.5-win64.zip
          unzip -q love-win64.zip -d build/win
          LOVEDIR=$(find build/win -maxdepth 1 -type d -name 'love-*')
          cat "$LOVEDIR/love.exe" build/hogger.love > "$LOVEDIR/hogger.exe"
          rm "$LOVEDIR/love.exe" "$LOVEDIR/lovec.exe"
          (cd "$LOVEDIR" && zip -9 -q -r "$GITHUB_WORKSPACE/build/hogger-win64.zip" .)

      - name: ".app bauen (macOS, LOEVE 11.5 gepinnt)"
        run: |
          curl -sL -o love-macos.zip \
            https://github.com/love2d/love/releases/download/11.5/love-11.5-macos.zip
          unzip -q love-macos.zip -d build/mac
          cp build/hogger.love build/mac/love.app/Contents/Resources/
          mv build/mac/love.app build/mac/hogger.app
          # -y erhaelt Symlinks der Frameworks — ohne das ist die App kaputt
          (cd build/mac && zip -9 -q -y -r "$GITHUB_WORKSPACE/build/hogger-macos.zip" hogger.app)

      - name: "Release anlegen"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/hogger.love build/hogger-win64.zip build/hogger-macos.zip \
            --title "Hogger muss sterben $GITHUB_REF_NAME" \
            --notes "LAN-Abend-Build: hogger.love (alle Plattformen mit installiertem LOEVE 11.5), hogger-win64.zip (hogger.exe, ohne Installation), hogger-macos.zip (hogger.app). Erster Start = Realm (GDD Kap. 3)."
