# Cross-Platform-Beweis (GDD 17.0 Punkt 2): Stufen 1+3 und Stufe 4 auf Windows
# und macOS. Linux laeuft im Schnellgate (ci.yml) und ist hier nicht doppelt.
#
# Seit das Repo oeffentlich ist, sind Actions-Minuten unbegrenzt frei — der
# Revisionsausloeser aus ADR 003 ist eingetreten, die Matrix haengt wieder an
# jedem PR statt nur auf Zuruf. Bleibt getrennt von ci.yml, weil das
# Ein-Job-Schnellgate in ~40 s rot oder gruen meldet, waehrend brew und der
# LOEVE-Download hier Minuten brauchen: schnelles Feedback zuerst, der
# vollstaendige Beweis daneben.
name: ci-plattform
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Montags 04:00 UTC: faengt Drift ausserhalb unserer Commits ab
    # (brew/apt-Paketstaende, Runner-Images), auch wenn zwischen zwei
    # LAN-Abenden niemand pusht.
    - cron: "0 4 * * 1"

concurrency:
  group: ci-plattform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plattform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: LuaJIT einrichten (macOS)
        if: runner.os == 'macOS'
        run: brew install luajit
      - name: LuaJIT einrichten (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/DevelopersCommunity/cmake-luajit/releases/download/v2.1.19907/LuaJIT-2.1.19907-win64.msi"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\luajit.msi"
          Start-Process msiexec.exe -ArgumentList "/i","$env:TEMP\luajit.msi","/qn" -Wait
          Add-Content $env:GITHUB_PATH "$env:LOCALAPPDATA\Programs\LuaJIT\bin"
      - name: "Stufe 1+3: Unit und Determinismus"
        run: luajit tests/run_all.lua --stage all

  stufe4:
    # Integration: Host + Bot-Clients in-process, fensterlos (GDD 17.0/17.7).
    # Windows ist hier neu: Rob entwickelt darauf, und Stufe 4 ist die einzige
    # Stufe, die Pfade, Zeilenenden und love.filesystem echt anfasst.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: LOEVE einrichten (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask love
      - name: LOEVE einrichten (Windows, 11.5 gepinnt wie im Release)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/love2d/love/releases/download/11.5/love-11.5-win64.zip" -OutFile love-win64.zip
          Expand-Archive love-win64.zip -DestinationPath lovewin
          $lovedir = (Get-ChildItem lovewin -Directory | Where-Object { $_.Name -like 'love-*' }).FullName
          Add-Content $env:GITHUB_PATH $lovedir
      - name: "Stufe 4: Integration (headless, Loopback) — macOS"
        if: runner.os == 'macOS'
        run: |
          export SDL_VIDEODRIVER=dummy
          "/Applications/love.app/Contents/MacOS/love" game --headless --test
      - name: "Stufe 4: Integration (headless, Loopback) — Windows"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # lovec.exe, NICHT love.exe: love.exe ist ein GUI-Subsystem-Binary
          # ohne angehaengte Konsole — Testausgabe waere unsichtbar. Die
          # Konsolenvariante lovec.exe liefert stdout und Exitcode.
          $env:SDL_VIDEODRIVER = "dummy"
          & lovec.exe game --headless --test

  plattform-gruen:
    # Ein einziger, stabiler Check-Name fuer den Branch-Schutz. Ohne dieses
    # Sammel-Gate muesste die Schutzregel jeden Matrix-Namen einzeln nennen
    # ("plattform (macos-latest)" ...) und braeche bei jeder Matrix-Aenderung.
    if: always()
    needs: [plattform, stufe4]
    runs-on: ubuntu-latest
    steps:
      - name: "Matrix-Ergebnisse pruefen"
        run: |
          echo "plattform=${{ needs.plattform.result }} stufe4=${{ needs.stufe4.result }}"
          [ "${{ needs.plattform.result }}" = "success" ] || exit 1
          [ "${{ needs.stufe4.result }}" = "success" ] || exit 1
