# CI-Schnellgate: Test-Pyramide Stufe 1 (Unit), Stufe 3 (Determinismus) und
# Stufe 4 (headless LOEVE, Loopback) in EINEM Linux-Job.
#
# Warum ein Job statt fuenf (ADR 003): GitHub rechnet Actions-Minuten pro Job
# auf die volle Minute AUF und multipliziert danach mit dem OS-Faktor
# (Linux 1x, Windows 2x, macOS 10x). Die alte 5-Job-Matrix lief 26 Sekunden
# und kostete 24 abgerechnete Minuten — 20 davon allein fuer zwei macOS-Jobs
# mit zusammen 21 Sekunden echter Rechenzeit. Nicht kuerzere Tests sparen,
# sondern weniger Jobs.
#
# Der Cross-Platform-Beweis (GDD 17.0 Punkt 2) laeuft daneben in
# ci-plattform.yml (Windows + macOS) — seit das Repo oeffentlich ist, wieder
# an jedem PR. Dieses Gate bleibt trotzdem ein einzelner Linux-Job: es meldet
# in ~40 s rot oder gruen, waehrend brew und der LOEVE-Download drueben
# Minuten brauchen. Schnelles Feedback zuerst, vollstaendiger Beweis daneben.
#
# Kein paths-ignore: In Kombination mit erzwungenen Status-Checks (Branch-
# Schutz auf main) wuerde ein reiner Doku-PR ewig auf einen Check warten, der
# nie startet. Bei 40 s Laufzeit ist Immer-Laufen die einfachere Wahrheit.
name: ci
on:
  push:
    branches: [main]
  pull_request:

# Ueberholte Laeufe sterben sofort, statt bezahlt zu Ende zu laufen.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: LuaJIT und LOEVE einrichten
        # Ein apt-Aufruf: jeder zusaetzliche Schritt kostet Sekunden, und
        # Sekunden werden hier zu ganzen Minuten aufgerundet.
        run: sudo apt-get update && sudo apt-get install -y luajit love
      - name: "Stufe 1+3: Unit und Determinismus"
        run: luajit tests/run_all.lua --stage all
      - name: "Stufe 4: Integration (headless, Loopback)"
        run: SDL_VIDEODRIVER=dummy love game --headless --test
