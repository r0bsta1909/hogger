# CI: Test-Pyramide Stufe 1 (Unit) + Stufe 3 (Determinismus) auf allen drei
# Plattformen — die Matrix IST der Cross-Platform-Beweis (GDD 17.0).
# Die leafo/gh-actions-lua-Action aus dem Skelett wurde ersetzt: Paketmanager-
# LuaJIT je OS ist robuster (Windows: dasselbe MSI wie auf dem Dev-Rechner).
# Stufe 2 (Sim, Minuten) laeuft bei Balancing-PRs; Stufe 4 folgt ab M2.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: LuaJIT einrichten (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: LuaJIT einrichten (macOS)
        if: runner.os == 'macOS'
        run: brew install luajit
      - name: LuaJIT einrichten (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/DevelopersCommunity/cmake-luajit/releases/download/v2.1.19907/LuaJIT-2.1.19907-win64.msi"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\luajit.msi"
          Start-Process msiexec.exe -ArgumentList "/i","$env:TEMP\luajit.msi","/qn" -Wait
          Add-Content $env:GITHUB_PATH "$env:LOCALAPPDATA\Programs\LuaJIT\bin"
      - name: "Stufe 1: Unit"
        run: luajit tests/run_all.lua --stage unit
      - name: "Stufe 3: Determinismus"
        run: luajit tests/run_all.lua --stage determinism

  stufe4:
    # Integration: Host + Bot-Clients in-process, fensterlos (GDD 17.0/17.7)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: LOEVE einrichten (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y love
      - name: LOEVE einrichten (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask love
      - name: "Stufe 4: Integration (headless, Loopback)"
        shell: bash
        run: |
          export SDL_VIDEODRIVER=dummy
          if [ "$RUNNER_OS" = "macOS" ]; then
            "/Applications/love.app/Contents/MacOS/love" game --headless --test
          else
            love game --headless --test
          fi
